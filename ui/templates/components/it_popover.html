<div
  data-popover="{{ triggered_by }}"
  data-it-popover
  hidden
  class="absolute left-0 top-0 z-10 min-w-72 rounded-xl border border-base-7 bg-base-2 p-3 shadow"
>
  <form
    method="post"
    hx-post="/rename/{{ type }}/{{ src_path }}"
    hx-swap="none"
    class="grid gap-3"
  >
    <label class="grid gap-2">    
      <span class="text-sm font-semibold">
        {{ t("editor.changeName") }}
      </span>

      <input
        name="name"
        value="{{ old_name }}"
        required
        autocomplete="off"
      >
    </label>

    <div class="flex justify-between mt-2">
      <button
        id="delete-it"
        type="button"
        class="btn btn-warning btn-icon"
        hx-delete="/{{ type }}/{{ src_path }}"
        hx-swap="none"
        hx-confirm='{{ t("editor.confirmDelete") }}'
      >
        {{ t("editor.delete") }}
      </button>

    <button
      id="rename-it"
      type="submit"
      class="ml-auto btn btn-primary btn-icon"
    >
      {{ t("editor.rename") }}
    </button>
  </form>
</div>
